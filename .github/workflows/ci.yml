name: Node.js CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, lint, build]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}
      - name: Verify health over HTTP
        if: matrix.check == 'build'
        run: pnpm test:e2e tests/e2e/health.spec.ts
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: node .next/standalone/server.js
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000/
          HOSTNAME: 127.0.0.1

  docker:
    name: Docker build and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
