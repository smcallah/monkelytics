name: Node.js CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, lint, build]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}
      - name: Verify identity boundaries in multiple server timezones
        if: matrix.check == 'test'
        run: |
          for timezone in UTC America/New_York Asia/Kathmandu; do
            TZ="$timezone" pnpm exec vitest run src/app/api/send/route.test.ts src/lib/crypto.test.ts src/lib/session.test.ts
          done
      - name: Verify health over HTTP
        if: matrix.check == 'build'
        run: pnpm test:e2e tests/e2e/health.spec.ts
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: node .next/standalone/server.js
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000/
          HOSTNAME: 127.0.0.1

  docker:
    name: Docker build and Compose configuration
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: monkelytics-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ipv6.yml config --quiet
        env:
          IPV6_SUBNET: fd64:2a6f:91ce:1::/64
          UMAMI_PORT: 3300
      - run: docker compose build
      - name: Save deployment settings
        run: |
          cat > .env <<'EOF'
          COMPOSE_FILE=docker-compose.yml:docker-compose.ipv6.yml
          COMPOSE_PATH_SEPARATOR=:
          COMPOSE_PROJECT_NAME=monkelytics-ci
          UMAMI_PORT=3300
          IPV6_SUBNET=fd64:2a6f:91ce:1::/64
          EOF
      - name: Verify Compose startup and network recreation
        run: |
          docker compose up --no-build -d --wait --wait-timeout 120
          curl --noproxy '*' -4 --fail http://localhost:3300/health
          curl --noproxy '*' -6 --fail http://localhost:3300/health
          docker compose down
          docker compose up --no-build -d --wait --wait-timeout 120
          curl --noproxy '*' -4 --fail http://localhost:3300/health
          curl --noproxy '*' -6 --fail http://localhost:3300/health
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI deployment
        if: always()
        run: docker compose down
