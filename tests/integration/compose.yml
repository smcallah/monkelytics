# Test-only overlay. Paths resolve against the repository's base Compose file.
services:
  umami:
    environment:
      SALT_ROTATION: day
      QUERY_STRING_POLICY: allowlist
      QUERY_STRING_ALLOWLIST: utm_source,utm_campaign
      TZ: America/New_York
      NODE_OPTIONS: --require /identity-test/server-clock.cjs
    volumes:
      - ./tests/integration/server-clock.cjs:/identity-test/server-clock.cjs:ro
